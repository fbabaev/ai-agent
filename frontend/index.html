<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise AI Assistant</title>
  <script src="script.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
      line-height: 1.6;
    }

    h1 {
      text-align: center;
      color: #333;
    }

    textarea {
      width: 100%;
      padding: 10px;
      font-size: 1em;
    }

    input[type="file"] {
      margin-bottom: 10px;
    }

    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }

    pre {
      background-color: #f8f8f8;
      padding: 15px;
      border: 1px solid #ddd;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
  </style>
</head>
<body>
  <h1>Enterprise AI Assistant</h1>

  <div>
    <input type="file" id="fileInput" />
    <button onclick="uploadFile()">Upload</button>
  </div>

  <hr />

  <div>
    <textarea id="question" rows="4" placeholder="Ask your question..."></textarea><br />
    <button onclick="askQuestion()">Ask</button>
  </div>

  <h3>Answer:</h3>
  <pre id="answer"></pre>

  <script>
    // Inline debugging
    console.log("HTML loaded, checking elements immediately...");
    console.log("fileInput:", document.getElementById("fileInput"));
    console.log("question:", document.getElementById("question"));
    console.log("answer:", document.getElementById("answer"));
    
    // Check again after a short delay
    setTimeout(function() {
      console.log("After delay - checking elements...");
      console.log("fileInput:", document.getElementById("fileInput"));
      console.log("question:", document.getElementById("question"));
      console.log("answer:", document.getElementById("answer"));
    }, 100);
  </script>
</body>
</html>
