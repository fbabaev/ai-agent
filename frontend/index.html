<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Enterprise AI Assistant</title>
  <script src="script.js" defer></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #fafbfc;
      margin: 0;
      min-height: 100vh;
    }
    .main-flex {
      display: flex;
      align-items: flex-start;
      justify-content: center;
      gap: 3em;
      max-width: 1200px;
      margin: 60px auto 0 auto;
    }
    #library-section {
      min-width: 270px;
      max-width: 320px;
      background: #f4f6fa;
      border-radius: 16px;
      padding: 2em 1.5em 1.5em 1.5em;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      margin-bottom: 2em;
      height: fit-content;
    }
    #library-section h2 {
      margin-top: 0;
      margin-bottom: 1.2em;
      font-size: 1.4em;
      letter-spacing: 0.01em;
    }
    #library {
      display: flex;
      flex-direction: column;
      gap: 1em;
    }
    .library-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #fff;
      border-radius: 8px;
      padding: 0.85em 1.2em 0.85em 1.2em;
      box-shadow: 0 1px 4px rgba(0,0,0,0.04);
      gap: 0;
      transition: box-shadow 0.2s;
      min-height: 38px;
    }
    .library-item:hover {
      box-shadow: 0 4px 16px rgba(0,0,0,0.10);
    }
    .library-item .library-left {
      display: flex;
      align-items: center;
      min-width: 0;
      flex: 1;
      overflow: hidden;
      flex-wrap: wrap;
      gap: 0.3em;
    }
    .library-item .library-filename {
      font-weight: 500;
      font-size: 1em;
      margin-right: 0.7em;
      white-space: normal;
      overflow: visible;
      text-overflow: unset;
      color: #222;
    }
    .library-item .library-timestamp {
      color: #aaa;
      font-size: 0.89em;
      white-space: normal;
      font-family: 'Menlo', 'Consolas', monospace;
      letter-spacing: 0.01em;
      margin-right: 0.7em;
    }
    .library-btn {
      border: none;
      border-radius: 4px;
      padding: 0.35em 1.2em;
      font-size: 1em;
      cursor: pointer;
      transition: background 0.2s, border 0.2s;
      margin-left: 0.5em;
      margin-top: 0;
      margin-bottom: 0;
      display: inline-block;
      height: 2.2em;
      line-height: 1.1em;
      vertical-align: middle;
    }
    .library-btn.edit {
      background: #0275d8;
      color: #fff;
      border: 1.5px solid #0275d8;
    }
    .library-btn.edit:hover {
      background: #0256a3;
      border: 1.5px solid #0256a3;
    }
    .library-btn.delete {
      background: #d9534f;
      color: #fff;
    }
    .library-btn.delete:hover {
      background: #b52b23;
    }
    .library-btn.cancel {
      background: #f5f5f5;
      color: #333;
      border: 1.5px solid #ccc;
      margin-left: 0.7em;
    }
    .library-btn.cancel:hover {
      background: #e0e0e0;
      border: 1.5px solid #bfc7d1;
    }
    .library-item .library-actions {
      display: flex;
      align-items: center;
      gap: 0.7em;
      margin-left: 0;
      flex-wrap: wrap;
      min-width: 0;
    }
    .library-item .edit-row {
      display: flex;
      align-items: center;
      width: 100%;
      gap: 0.7em;
      flex-wrap: wrap;
      max-width: 100%;
    }
    .library-item input[type="text"] {
      font-size: 1em;
      padding: 0.35em 0.7em;
      border-radius: 5px;
      border: 1.5px solid #bfc7d1;
      background: #f8fafc;
      margin-right: 0.2em;
      margin-left: 0.1em;
      min-width: 120px;
      max-width: 180px;
      width: 100%;
      color: #222;
      box-sizing: border-box;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
    }
    .library-item input[type="text"]:focus {
      border: 1.5px solid #0275d8;
      background: #fff;
      box-shadow: 0 0 0 2px #e3f0fc;
    }
    .library-item .library-timestamp {
      margin-top: 0.2em;
    }
    .main-content {
      flex: 1;
      min-width: 0;
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.06);
      padding: 2.5em 2.5em 2em 2.5em;
      margin-top: 0.5em;
      max-width: 600px;
    }
    input[type="file"] {
      margin-bottom: 10px;
    }
    button {
      margin-top: 10px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }
    pre {
      background-color: #f8f8f8;
      padding: 15px;
      border: 1px solid #ddd;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    h1 {
      text-align: center;
      color: #333;
      margin-top: 40px;
      margin-bottom: 0.5em;
      font-size: 2.2em;
    }
    @media (max-width: 900px) {
      .main-flex {
        flex-direction: column;
        align-items: stretch;
        gap: 2em;
        margin: 30px 0 0 0;
      }
      .main-content {
        max-width: 100vw;
        border-radius: 0 0 16px 16px;
      }
      #library-section {
        max-width: 100vw;
        border-radius: 16px 16px 0 0;
      }
    }
    @media (max-width: 600px) {
      .library-item .library-left {
        flex-direction: column;
        align-items: flex-start;
        gap: 0.1em;
      }
      .library-item {
        padding: 0.7em 0.7em 0.7em 0.7em;
      }
    }
    .delete-modal-content {
      background: #fff;
      padding: 2.2em 2.5em 2em 2.5em;
      border-radius: 14px;
      box-shadow: 0 4px 32px rgba(0,0,0,0.18);
      text-align: center;
      min-width: 320px;
      max-width: 90vw;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1em;
    }
    .delete-modal-icon {
      font-size: 2.5em;
      color: #d9534f;
      margin-bottom: 0.2em;
    }
    .delete-modal-title {
      font-size: 1.25em;
      font-weight: 600;
      margin-bottom: 0.2em;
      color: #222;
    }
    .delete-modal-message {
      font-size: 1.08em;
      color: #444;
      margin-bottom: 0.7em;
    }
    .delete-modal-actions {
      display: flex;
      gap: 1.2em;
      justify-content: center;
      width: 100%;
    }
    .delete-modal-btn {
      padding: 0.5em 2em;
      border-radius: 5px;
      font-size: 1.08em;
      border: none;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.2s, color 0.2s;
    }
    .delete-modal-btn.delete {
      background: #d9534f;
      color: #fff;
    }
    .delete-modal-btn.delete:hover {
      background: #b52b23;
    }
    .delete-modal-btn.cancel {
      background: #f5f5f5;
      color: #333;
      border: 1.5px solid #ccc;
    }
    .delete-modal-btn.cancel:hover {
      background: #e0e0e0;
      color: #222;
    }
    #toast {
      position: fixed;
      left: 50%;
      bottom: 40px;
      transform: translateX(-50%);
      background: #222;
      color: #fff;
      padding: 1em 2.2em;
      border-radius: 8px;
      font-size: 1.08em;
      font-weight: 500;
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      opacity: 0;
      pointer-events: none;
      z-index: 2000;
      transition: opacity 0.4s, bottom 0.4s;
    }
    #toast.show {
      opacity: 1;
      bottom: 60px;
      pointer-events: auto;
    }
    .library-item.removing {
      opacity: 0;
      transition: opacity 0.4s;
    }
  </style>
</head>
<body>
  <h1>Enterprise AI Assistant</h1>
  <div class="main-flex">
    <div id="library-section">
      <h2>Library</h2>
      <div id="library"></div>
    </div>
    <div class="main-content">
      <input type="file" id="fileInput" />
      <button id="uploadBtn">Upload</button>
      <br /><br />
      <textarea id="question" rows="4" style="width:100%;" placeholder="Ask your question..."></textarea>
      <br />
      <button id="askBtn">Ask</button>
      <br /><br />
      <div><b>Answer:</b></div>
      <pre id="answer"></pre>
    </div>
  </div>
  <div id="deleteModal" style="display:none; position:fixed; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.25); align-items:center; justify-content:center; z-index:1000;">
    <div class="delete-modal-content">
      <div class="delete-modal-icon">&#9888;</div>
      <div class="delete-modal-title">Delete File</div>
      <div class="delete-modal-message">Are you sure you want to delete this file?</div>
      <div class="delete-modal-actions">
        <button id="confirmDeleteBtn" class="delete-modal-btn delete">Delete</button>
        <button id="cancelDeleteBtn" class="delete-modal-btn cancel">Cancel</button>
      </div>
    </div>
  </div>
  <div id="toast"></div>
</body>
</html>
